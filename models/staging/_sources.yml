version: 2

sources:
  - name: banking_raw
    description: Fivetran-replicated copy of the Neon Postgres banking schema.
    database: DB_BANKING
    schema: POSTGRES_BANKING
    loaded_at_field: _fivetran_synced
    freshness:
      warn_after: {count: 8, period: hour}
      error_after: {count: 12, period: hour}
    tables:
      - name: customers
      - name: accounts
      - name: merchants
      - name: transactions
      