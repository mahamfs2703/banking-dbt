version: 2

models:
  - name: dim_customer
    description: SCD Type 2 customer dimension (one row per customer version),
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: kyc_status
        data_tests: 
          - accepted_values:
              values: ['PENDING', 'VERIFIED', 'REJECTED']

  - name: dim_account
    description: SCD Type 2 account dimension (one row per account version). Balance is intentionally excluded.
    columns:
      - name: account_key
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [not_null]
      - name: account_type
        data_tests:
          - accepted_values:
              values: ['SAVINGS', 'CHECKING', 'CREDIT']
      - name: status
        data_tests:
          - accepted_values:
              values: ['ACTIVE', 'FROZEN', 'CLOSED']

  - name: dim_merchant
    description: Merchant dimension, current state only.
    columns:
      - name: merchant_key
        data_tests: [unique, not_null]
      - name: merchant_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension from 2024-01-01 to 2028-12-31.
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]